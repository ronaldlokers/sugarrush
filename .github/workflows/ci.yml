name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint is platform-independent, so run fmt + clippy once (kept as `check`).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The same version mise pins, so a green local run means a green CI run —
      # mise.toml claimed this was already true.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Force the README demo to stay current: if a PR changes the rendering source
  # or the tape, it must also regenerate assets/demo.gif. Non-visual edits to
  # those files can bypass with "[skip-demo]" in the PR title.
  demo-current:
    name: demo gif current
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[skip-demo]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: demo.gif regenerated when the UI changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "origin/$BASE"...HEAD)
          # settings.rs produces every string on the settings screen and agp.rs
          # the AGP title text, so both change what the recording shows.
          ui=$(echo "$changed" | grep -E '^(src/ui\.rs|src/theme\.rs|src/bigfont\.rs|src/app\.rs|src/settings\.rs|src/agp\.rs|assets/demo\.tape)$' || true)
          if [ -n "$ui" ] && ! echo "$changed" | grep -qx 'assets/demo.gif'; then
            echo "::error::UI/rendering changed but assets/demo.gif was not regenerated:"
            echo "$ui"
            echo "Run: mise x vhs ttyd -- vhs assets/demo.tape   then commit assets/demo.gif"
            echo "If the change is not visible in --demo, add '[skip-demo]' to the PR title."
            exit 1
          fi
          echo "demo.gif is current"

  # The repo conventions that aren't expressible as a Rust test: every Field is
  # on the settings screen, every persisted key is in config.example.toml.
  process:
    name: repo conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/check-process.sh

  # A user-visible change has to bring a changelog entry with it. Bypass a
  # non-user-visible source edit with "[skip-changelog]" in the PR title.
  changelog:
    name: changelog updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[skip-changelog]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: CHANGELOG.md updated when src/ changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "origin/$BASE"...HEAD)
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::src/ changed but CHANGELOG.md was not updated."
            echo "Add a bullet under '## [Unreleased]', or put '[skip-changelog]' in the PR title"
            echo "if the change isn't user-visible (refactor, tests, internal cleanup)."
            exit 1
          fi
          echo "changelog is current"

  # The MSRV in Cargo.toml is a promise; check it still builds rather than
  # discovering at install time that it doesn't.
  msrv:
    name: msrv build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all-targets --locked

  # Dependabot's cooldown governs *upgrades*; nothing failed a build when an
  # advisory landed against a version already in Cargo.lock — which, for a
  # long-running daemon holding a bearer token, is the case that matters.
  advisories:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the shipped lockfile
        run: cargo audit --deny warnings

  # Build + test on every platform we ship to, so platform-specific breakage
  # (notify-rust, sound.rs, terminal handling) is caught here, not at tag time.
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # --locked: prove the dependency set that actually ships compiles, which
      # is what `cargo publish --locked` will send.
      - name: Build
        run: cargo build --locked --verbose
      - name: Test
        run: cargo test --locked --verbose
