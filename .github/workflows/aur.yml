name: Publish to AUR

# Push sugarrush-bin to the AUR once release binaries exist. Triggered after
# the dist "Release" workflow finishes (the release assets are then present),
# or manually via workflow_dispatch for a given tag. No-ops until the
# AUR_SSH_KEY secret is set.
#
# Note: `on: release` doesn't fire for releases created by the default
# GITHUB_TOKEN, which is why this keys off the Release workflow instead.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2026.7.1)"
        required: true

permissions:
  contents: read

jobs:
  aur:
    # On workflow_run only proceed if the release actually produced artifacts
    # (host job succeeded); manual dispatch always proceeds.
    # `failure` is not `cancelled`: the old check let a Release that broke
    # partway still publish to the AUR from whatever assets had uploaded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Check inputs
        id: gate
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY not set — skipping AUR publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TAG" in
            v[0-9]*) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "not a version tag: '$TAG' — skipping."; echo "ready=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download release asset
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Use the API (gh) not the browser download URL — the latter can 404
          # for dist-created releases even when the asset is fully uploaded.
          for i in $(seq 1 20); do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                 -p 'sugarrush-x86_64-unknown-linux-musl.tar.xz' -O /tmp/sr.tar.xz --clobber; then
              echo "got asset"; exit 0
            fi
            echo "waiting for release asset ($i)…"; sleep 10
          done
          echo "release asset not found for $TAG"; exit 1

      - name: Render PKGBUILD
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          sha="$(sha256sum /tmp/sr.tar.xz | cut -d' ' -f1)"
          sed -e "s/@VERSION@/${ver}/" -e "s/@SHA256@/${sha}/" \
            packaging/aur/PKGBUILD.in > packaging/aur/PKGBUILD
          echo "----- PKGBUILD -----"; cat packaging/aur/PKGBUILD

      # The PKGBUILD's source= URL is what every `yay -S sugarrush-bin` will
      # fetch. Publishing one that 404s ships a package nobody can build, so
      # check it resolves before pushing to the AUR.
      - name: Verify the PKGBUILD source URL resolves
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # source= interpolates ${pkgver}, which makepkg expands and curl
          # doesn't — expand it here or this checks a URL nobody ever fetches.
          ver="${TAG#v}"
          url=$(sed -n 's/.*::\(https:[^"]*\)".*/\1/p' packaging/aur/PKGBUILD |
            sed "s/\${pkgver}/${ver}/g")
          test -n "$url" || { echo "::error::no source URL in the rendered PKGBUILD"; exit 1; }
          case "$url" in
            *'$'*) echo "::error::unexpanded variable left in the source URL: $url"; exit 1 ;;
          esac
          echo "checking $url"
          for i in $(seq 1 12); do
            if curl -fsSL --retry 2 -o /tmp/pkgsrc.tar.xz "$url"; then
              # Same bytes the sha256sums line was computed from?
              rendered=$(sed -n "s/^sha256sums=('\(.*\)')/\1/p" packaging/aur/PKGBUILD)
              actual=$(sha256sum /tmp/pkgsrc.tar.xz | cut -d' ' -f1)
              if [ "$rendered" != "$actual" ]; then
                echo "::error::PKGBUILD checksum $rendered does not match the published asset ($actual)"
                exit 1
              fi
              echo "source URL is live and matches the checksum"
              exit 0
            fi
            echo "not available yet ($i)…"; sleep 10
          done
          echo "::error::PKGBUILD source URL never became available: $url"
          exit 1

      - name: Publish
        if: steps.gate.outputs.ready == 'true'
        # Pinned to the commit behind v4.2.0: this step holds the AUR SSH key,
        # and a mutable tag can be repointed at any time.
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: sugarrush-bin
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: ronaldlokers
          commit_email: ronald@lokers.email
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: "Update to ${{ env.TAG }}"
          updpkgsums: false
